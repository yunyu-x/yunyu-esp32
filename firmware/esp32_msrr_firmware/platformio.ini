; PlatformIO Project Configuration File for microUnit ESP32-S3 MVP Firmware
; First-Principles Verified MSRR Embedded Controller

[platformio]
default_envs = esp32s3_prototype
src_dir = src
include_dir = include

[env:esp32s3_prototype]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Target MCU Hardware Specs
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; Build Optimization & Compile Definitions
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARM_MATH_CM4
    -O2

; Serial & Monitor Configuration
monitor_speed = 115200
upload_speed = 921600

; External Library Dependencies
lib_deps = 
    electroniccats/MPU6050 @ ^1.3.1
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1
