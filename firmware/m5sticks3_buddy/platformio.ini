; PlatformIO Project Configuration File for M5Stack StickS3 Claude Buddy & Ground Debugger
; Professional Embedded Driver Stack & HIL Telemetry Terminal

[platformio]
default_envs = m5sticks3_buddy
src_dir = src
include_dir = include

[env:m5sticks3_buddy]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Target MCU Hardware Specifications
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

; Build Optimization & Compile Definitions
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -lesp_websocket_client
    -O2

; Serial & Monitor Configuration
monitor_speed = 115200
upload_speed = 1500000

; External Library Dependencies
lib_deps = 
    m5stack/M5Unified @ ^0.1.16
    m5stack/M5GFX @ ^0.1.16
    bblanchon/ArduinoJson @ ^7.0.4
