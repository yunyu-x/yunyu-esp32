[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yunyu-esp32"
version = "2.1.0"
description = "Official open-source hardware, firmware, and HIL ground terminal suite for the Yunyu (LingCube) modular robotics ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yunyu Project Contributors", email = "contact@yunyu-robotics.org" }
]
keywords = [
    "esp32", "esp32-s3", "m5stack", "sticks3", "robotics",
    "hardware", "firmware", "platformio", "ble-nus", "audio-stream"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Embedded Systems"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --durations=10"
